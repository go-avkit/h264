name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# CI pins the Go release below (Renovate moves it). The go.mod floor is 1.27.1.
jobs:
  # Every file must be gofmt-clean.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # Build, vet, race-test, and enforce 100% statement coverage on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      # The header and derivation layer (the root package) is held to 100%. The
      # decoder under decoder/ and internal/ is imported from go.264 and is held
      # by its tests, the conformance vectors and the fuzzers below instead.
      - name: Test the decoder
        run: go test -race ./decoder/... ./internal/...
      - name: Test the tools module
        working-directory: tools
        run: go vet ./... && go test -race ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          go test -race -coverpkg=github.com/go-avkit/h264 -coverprofile=cover.out .
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Run the suite on the six supported 64-bit targets. amd64/arm64 run natively;
  # the rest run under qemu-user. A bitstream reader takes multi-byte fields apart
  # by hand, so this is also the big-/little-endian correctness gate (s390x is
  # big-endian).
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go env GOARCH && go test ./...

  # The one 32-bit target. 386 runs natively on the amd64 runner, without qemu,
  # and it is where int and uint are 32 bits wide: a length converted to int
  # before it is compared, or a sum done in uint, wraps only here. The L8
  # security audit (go-avkit/avkit#54) found five of its eight defects on 32-bit
  # targets alone, none of which the 64-bit lanes could see. Coverage is gated
  # on the 64-bit lanes; this one only vets and tests.
  arch-386:
    name: arch 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: GOARCH=386 go vet ./...
      - run: GOARCH=386 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          GOARCH=${{ matrix.goarch }} go test -exec="$q" ./...

  # The decoder against ITU-T H.264.1: every picture of every stream the
  # manifests of testdata/jvt name must match ffmpeg's framemd5, bit for bit.
  # H264_JVT_REQUIRE=1 makes a stream that failed to download a failure, not a skip.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Fetch the JVT streams
        working-directory: tools
        run: go run ./jvtfetch --dir "$RUNNER_TEMP/jvt" --manifests ../testdata/jvt
      - name: Decode them
        env:
          H264_JVT_DIR: ${{ runner.temp }}/jvt
          H264_JVT_REQUIRE: '1'
        run: go test -count=1 -v -run '^TestJVTConformance$' ./decoder

  # The decoder and the header reader take hostile input: no byte string may
  # panic or hang them. The corpus is committed (testdata/fuzzseed,
  # testdata/conformance, testdata/fuzz); a finding is written to testdata/fuzz.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go test -run='^$' -fuzz='^FuzzDecode$' -fuzztime=60s ./decoder
      - run: go test -run='^$' -fuzz='^FuzzStream$' -fuzztime=30s .
      - run: go test -run='^$' -fuzz='^FuzzParameterSets$' -fuzztime=30s .
